name: Build WindowsProtect test

on:
  workflow_dispatch:
  push:
    paths:
      - "windows-agent/**"
      - ".github/workflows/build-windowsprotect.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Create WindowsProtect icon
        shell: powershell
        run: ./windows-agent/Build-BrandAssets.ps1
      - name: Compile fixed-purpose user interface and updater
        shell: powershell
        run: |
          $csc = (Get-ChildItem "$env:WINDIR\Microsoft.NET\Framework64" -Recurse -Filter csc.exe | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          & $csc /nologo /target:winexe /main:WindowsProtectUserUI /out:WindowsProtect_UserUI.exe /win32icon:WindowsProtect.ico /reference:System.Windows.Forms.dll /reference:System.Drawing.dll windows-agent\WindowsProtect_UserUI.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $csc /nologo /target:winexe /main:WindowsProtectUpdate /out:WindowsProtect_Update.exe /win32icon:WindowsProtect.ico /reference:System.ServiceProcess.dll windows-agent\WindowsProtect_Update.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify managed removal protection
        shell: powershell
        run: ./windows-agent/Verify-Tamper.ps1
      - name: Reject hidden script execution in shipped components
        shell: powershell
        run: |
          $sources=@(
            'windows-agent/DeviceSupportHost.cs','windows-agent/AutomaticUpdater.cs','windows-agent/WindowsProtect_Update.cs',
            'windows-agent/WindowsProtect_UserUI.cs','windows-agent/WindowsProtect_Remove.cs','windows-agent/WindowsProtect_Setup.cs'
          )
          $matches=Select-String -Path $sources -Pattern 'powershell\.exe|ExecutionPolicy\s+Bypass|apply-agent-update\.ps1|cmd\.exe'
          if($matches){$matches | Format-Table | Out-String | Write-Error;throw 'A shipped component reintroduced hidden script execution.'}
      - name: Verify remote-tool identities and Windows dialogs
        shell: powershell
        run: |
          ./windows-agent/Verify-Blocking.ps1
          ./windows-agent/Verify-MessageDialog.ps1
      - name: Compile detached remover
        shell: powershell
        run: |
          $csc = (Get-ChildItem "$env:WINDIR\Microsoft.NET\Framework64" -Recurse -Filter csc.exe | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          & $csc /nologo /target:exe /out:WindowsProtect_Remove.exe /reference:System.ServiceProcess.dll /reference:System.Security.dll windows-agent\WindowsProtect_Remove.cs windows-agent\TamperProtection.cs windows-agent\WindowsServiceTools.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\WindowsProtect_Remove.exe --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Azure signing login
        if: vars.WINDOWS_SIGNING_ENABLED == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign detached remover
        if: vars.WINDOWS_SIGNING_ENABLED == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.WINDOWS_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.WINDOWS_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.WINDOWS_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}
          files-folder-filter: WindowsProtect_Remove.exe
          file-digest: SHA256
          timestamp-digest: SHA256
      - name: Compile monitoring agent
        shell: powershell
        run: |
          $csc = (Get-ChildItem "$env:WINDIR\Microsoft.NET\Framework64" -Recurse -Filter csc.exe | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          & $csc /nologo /target:exe /main:DeviceSupportHost /out:DeviceSupportHost.exe /reference:System.ServiceProcess.dll /reference:System.Security.dll /resource:WindowsProtect_Remove.exe,WindowsProtect_Remove.exe windows-agent\DeviceSupportHost.cs windows-agent\ProtectionActivation.cs windows-agent\RemovalCoordinator.cs windows-agent\TamperProtection.cs windows-agent\RemoteToolPolicy.cs windows-agent\AutomaticUpdater.cs windows-agent\WindowsServiceTools.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify automatic update safety
        shell: powershell
        run: |
          $csc = (Get-ChildItem "$env:WINDIR\Microsoft.NET\Framework64" -Recurse -Filter csc.exe | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          & $csc /nologo /target:exe /main:AutomaticUpdaterVerifier /out:AutomaticUpdaterVerifier.exe windows-agent\AutomaticUpdater.cs windows-agent\AutomaticUpdaterVerifier.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\AutomaticUpdaterVerifier.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile enrollment test app
        shell: powershell
        run: |
          $csc = (Get-ChildItem "$env:WINDIR\Microsoft.NET\Framework64" -Recurse -Filter csc.exe | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          & $csc /nologo /target:exe /out:WindowsProtect_Test.exe /reference:System.Security.dll windows-agent\WindowsProtect_Test.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Sign the payload BEFORE embedding it. Signing only the installer leaves
      # the installed service unsigned.
      - name: Sign service and test app
        if: vars.WINDOWS_SIGNING_ENABLED == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.WINDOWS_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.WINDOWS_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.WINDOWS_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}
          files-folder-filter: DeviceSupportHost.exe,WindowsProtect_Test.exe,WindowsProtect_UserUI.exe,WindowsProtect_Update.exe
          file-digest: SHA256
          timestamp-digest: SHA256
      - name: Compile single WindowsProtect setup
        shell: powershell
        run: |
          $csc = (Get-ChildItem "$env:WINDIR\Microsoft.NET\Framework64" -Recurse -Filter csc.exe | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          & $csc /nologo /target:winexe /out:WindowsProtect_Setup.exe /win32icon:WindowsProtect.ico /win32manifest:windows-agent\WindowsProtect_Setup.manifest /reference:System.Windows.Forms.dll /reference:System.Drawing.dll /reference:System.Security.dll /reference:System.ServiceProcess.dll /reference:System.Web.Extensions.dll /resource:DeviceSupportHost.exe,DeviceSupportHost.exe /resource:WindowsProtect_UserUI.exe,WindowsProtect_UserUI.exe /resource:WindowsProtect_Update.exe,WindowsProtect_Update.exe windows-agent\WindowsProtect_Setup.cs windows-agent\ProtectionActivation.cs windows-agent\TamperProtection.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify installer and render preview
        shell: powershell
        run: ./windows-agent/Verify-Setup.ps1
      - name: Sign installer
        if: vars.WINDOWS_SIGNING_ENABLED == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.WINDOWS_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.WINDOWS_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.WINDOWS_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}
          files-folder-filter: WindowsProtect_Setup.exe
          file-digest: SHA256
          timestamp-digest: SHA256
      - name: Scan release binaries with Microsoft Defender
        shell: powershell
        run: |
          $status=Get-MpComputerStatus
          if(-not $status.AntivirusEnabled){throw 'Microsoft Defender Antivirus is not active on the release runner.'}
          Update-MpSignature
          $files=@('DeviceSupportHost.exe','WindowsProtect_Update.exe','WindowsProtect_UserUI.exe','WindowsProtect_Remove.exe','WindowsProtect_Setup.exe')
          foreach($file in $files){
            Start-MpScan -ScanType CustomScan -ScanPath (Resolve-Path $file)
            if(-not(Test-Path $file)){throw "Microsoft Defender quarantined $file"}
          }
          $detections=@(Get-MpThreatDetection | Where-Object {$_.Resources -match 'WindowsProtect|DeviceSupportHost'})
          if($detections.Count -gt 0){$detections | Format-List | Out-String | Write-Error;throw 'Microsoft Defender detected a release component.'}
          'Microsoft Defender scanned every distributed executable without detection.' | Out-File -Append $env:GITHUB_STEP_SUMMARY
      - name: Exercise installer persistence under Microsoft Defender
        shell: powershell
        run: |
          $started=(Get-Date).ToUniversalTime().AddSeconds(-2)
          $process=Start-Process .\WindowsProtect_Setup.exe -ArgumentList '--defender-behavior-probe' -PassThru -Wait
          if($process.ExitCode -ne 0){throw 'The isolated installer behavior probe failed.'}
          Start-Sleep -Seconds 8
          if(-not(Test-Path .\WindowsProtect_Setup.exe)){throw 'Microsoft Defender quarantined the installer during the behavior probe.'}
          $detections=@(Get-MpThreatDetection | Where-Object {$_.Resources -match 'WindowsProtect|DeviceSupportHost' -and $_.InitialDetectionTime.ToUniversalTime() -ge $started})
          if($detections.Count -gt 0){$detections | Format-List | Out-String | Write-Error;throw 'Microsoft Defender detected installer behavior.'}
          if(Get-Service WindowsProtectBehaviorProbe -ErrorAction SilentlyContinue){throw 'Behavior probe service was not cleaned up.'}
          if((Test-Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run') -and (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run').WindowsProtectBehaviorProbe){throw 'Behavior probe Run entry was not cleaned up.'}
          'Microsoft Defender allowed the isolated service/Run/ACL installation behavior.' | Out-File -Append $env:GITHUB_STEP_SUMMARY
      - name: Verify signing and hash binaries
        shell: powershell
        env:
          SIGNING_ENABLED: ${{ vars.WINDOWS_SIGNING_ENABLED }}
        run: |
          $files = @('DeviceSupportHost.exe','WindowsProtect_Test.exe','WindowsProtect_Setup.exe','WindowsProtect_Remove.exe','WindowsProtect_UserUI.exe','WindowsProtect_Update.exe')
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file
            if ($env:SIGNING_ENABLED -eq 'true' -and $signature.Status -ne 'Valid') {
              throw "Invalid release signature: $file"
            }
          }
          $files | ForEach-Object { Get-FileHash $_ -Algorithm SHA256 } | Format-List | Out-File SHA256.txt
          $signing = if ($env:SIGNING_ENABLED -eq 'true') { 'Trusted signing enabled; signatures verified.' } else { 'UNSIGNED TEST BUILD. Windows may show SmartScreen and unknown-publisher warnings. Trusted signing is not configured.' }
          @("WindowsProtect 0.5.16-test", "Commit: $env:GITHUB_SHA", $signing, 'Microsoft Defender scanned all distributed components during this build.', 'Unauthorized remote-access processes and services are blocked locally, reported to the dashboard and shown to the Windows user.') | Out-File BUILD-INFO.txt
          $signing | Out-File -Append $env:GITHUB_STEP_SUMMARY
      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: WindowsProtect-v0.5.16-test
          path: |
            WindowsProtect_Test.exe
            DeviceSupportHost.exe
            WindowsProtect_Setup.exe
            WindowsProtect_Setup_Preview.png
            WindowsProtect_Message_Preview.png
            WindowsProtect_UserUI.exe
            WindowsProtect_Update.exe
            SHA256.txt
            BUILD-INFO.txt
          retention-days: 14

      - name: Publish dashboard installer download
        if: github.ref == 'refs/heads/main'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $hash=(Get-FileHash WindowsProtect_Setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $agentHash=(Get-FileHash DeviceSupportHost.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          @{version='0.5.16';sha256=$hash} | ConvertTo-Json -Compress | Set-Content installer-sha256.json -Encoding UTF8
          @{version='0.5.16';sha256=$agentHash} | ConvertTo-Json -Compress | Set-Content agent-sha256.json -Encoding UTF8
          @('WindowsProtect 0.5.16 prerelease.', 'Blocks and records unauthorized remote-access processes and services, warns the Windows user locally, and shows urgent dashboard alerts with the affected PC, tool and time.', 'Approved MeshCentral and time-limited UltraViewer access remain exempt from unauthorized-tool alerts.', 'Every distributed executable passed Microsoft Defender scanning in the release workflow.', 'Unsigned build: Windows may still show an unknown-publisher reputation warning until trusted signing is configured.') | Set-Content RELEASE-NOTES.txt -Encoding UTF8
          $ErrorActionPreference='Continue'
          gh release view v0.5.16 --repo $env:GITHUB_REPOSITORY 2>$null | Out-Null
          $releaseExists=($LASTEXITCODE -eq 0)
          $ErrorActionPreference='Stop'
          if ($releaseExists) { throw 'Release v0.5.16 already exists. Increment the release version instead of overwriting it.' }
          gh release create v0.5.16 WindowsProtect_Setup.exe DeviceSupportHost.exe WindowsProtect_UserUI.exe WindowsProtect_Update.exe installer-sha256.json agent-sha256.json SHA256.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'WindowsProtect 0.5.16' --prerelease --notes-file RELEASE-NOTES.txt
          if ($LASTEXITCODE -ne 0) { throw 'Unable to publish installer download.' }
