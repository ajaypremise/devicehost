name: Build WindowsProtect test

on:
  workflow_dispatch:
  push:
    paths:
      - "windows-agent/**"
      - ".github/workflows/build-windowsprotect.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Create WindowsProtect icon
        shell: powershell
        run: ./windows-agent/Build-BrandAssets.ps1
      - name: Verify managed removal protection
        shell: powershell
        run: ./windows-agent/Verify-Tamper.ps1
      - name: Verify remote-tool identities and Windows dialogs
        shell: powershell
        run: |
          ./windows-agent/Verify-Blocking.ps1
          ./windows-agent/Verify-MessageDialog.ps1
      - name: Compile detached remover
        shell: powershell
        run: |
          $csc = (Get-ChildItem "$env:WINDIR\Microsoft.NET\Framework64" -Recurse -Filter csc.exe | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          & $csc /nologo /target:exe /out:WindowsProtect_Remove.exe /reference:System.ServiceProcess.dll /reference:System.Security.dll /reference:System.Management.dll windows-agent\WindowsProtect_Remove.cs windows-agent\TamperProtection.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\WindowsProtect_Remove.exe --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Azure signing login
        if: vars.WINDOWS_SIGNING_ENABLED == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign detached remover
        if: vars.WINDOWS_SIGNING_ENABLED == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.WINDOWS_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.WINDOWS_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.WINDOWS_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}
          files-folder-filter: WindowsProtect_Remove.exe
          file-digest: SHA256
          timestamp-digest: SHA256
      - name: Compile monitoring agent
        shell: powershell
        run: |
          $csc = (Get-ChildItem "$env:WINDIR\Microsoft.NET\Framework64" -Recurse -Filter csc.exe | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          & $csc /nologo /target:exe /main:DeviceSupportHost /out:DeviceSupportHost.exe /reference:System.ServiceProcess.dll /reference:System.Security.dll /reference:System.Management.dll /resource:WindowsProtect_Remove.exe,WindowsProtect_Remove.exe windows-agent\DeviceSupportHost.cs windows-agent\ProtectionActivation.cs windows-agent\RemovalCoordinator.cs windows-agent\WindowsProtect_Remove.cs windows-agent\TamperProtection.cs windows-agent\RemoteToolPolicy.cs windows-agent\AutomaticUpdater.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify automatic update safety
        shell: powershell
        run: |
          $csc = (Get-ChildItem "$env:WINDIR\Microsoft.NET\Framework64" -Recurse -Filter csc.exe | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          & $csc /nologo /target:exe /main:AutomaticUpdaterVerifier /out:AutomaticUpdaterVerifier.exe windows-agent\AutomaticUpdater.cs windows-agent\AutomaticUpdaterVerifier.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\AutomaticUpdaterVerifier.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile enrollment test app
        shell: powershell
        run: |
          $csc = (Get-ChildItem "$env:WINDIR\Microsoft.NET\Framework64" -Recurse -Filter csc.exe | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          & $csc /nologo /target:exe /out:WindowsProtect_Test.exe /reference:System.Security.dll windows-agent\WindowsProtect_Test.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Sign the payload BEFORE embedding it. Signing only the installer leaves
      # the installed service unsigned.
      - name: Sign service and test app
        if: vars.WINDOWS_SIGNING_ENABLED == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.WINDOWS_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.WINDOWS_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.WINDOWS_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}
          files-folder-filter: DeviceSupportHost.exe,WindowsProtect_Test.exe
          file-digest: SHA256
          timestamp-digest: SHA256
      - name: Compile single WindowsProtect setup
        shell: powershell
        run: |
          $csc = (Get-ChildItem "$env:WINDIR\Microsoft.NET\Framework64" -Recurse -Filter csc.exe | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          & $csc /nologo /target:winexe /out:WindowsProtect_Setup.exe /win32icon:WindowsProtect.ico /win32manifest:windows-agent\WindowsProtect_Setup.manifest /reference:System.Windows.Forms.dll /reference:System.Drawing.dll /reference:System.Security.dll /reference:System.ServiceProcess.dll /reference:System.Management.dll /reference:System.Web.Extensions.dll /resource:windows-agent\WindowsProtect_MessageDialog.ps1,WindowsProtect_MessageDialog.ps1 /resource:DeviceSupportHost.exe,DeviceSupportHost.exe windows-agent\WindowsProtect_Setup.cs windows-agent\ProtectionActivation.cs windows-agent\TamperProtection.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify installer and render preview
        shell: powershell
        run: ./windows-agent/Verify-Setup.ps1
      - name: Sign installer
        if: vars.WINDOWS_SIGNING_ENABLED == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.WINDOWS_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.WINDOWS_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.WINDOWS_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}
          files-folder-filter: WindowsProtect_Setup.exe
          file-digest: SHA256
          timestamp-digest: SHA256
      - name: Verify signing and hash binaries
        shell: powershell
        env:
          SIGNING_ENABLED: ${{ vars.WINDOWS_SIGNING_ENABLED }}
        run: |
          $files = @('DeviceSupportHost.exe','WindowsProtect_Test.exe','WindowsProtect_Setup.exe','WindowsProtect_Remove.exe')
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file
            if ($env:SIGNING_ENABLED -eq 'true' -and $signature.Status -ne 'Valid') {
              throw "Invalid release signature: $file"
            }
          }
          $files | ForEach-Object { Get-FileHash $_ -Algorithm SHA256 } | Format-List | Out-File SHA256.txt
          $signing = if ($env:SIGNING_ENABLED -eq 'true') { 'Trusted signing enabled; signatures verified.' } else { 'UNSIGNED TEST BUILD. Windows may show SmartScreen and unknown-publisher warnings. Trusted signing is not configured.' }
          @("WindowsProtect 0.5.11-test", "Commit: $env:GITHUB_SHA", $signing, 'Run WindowsProtect_Setup.exe on the disposable Windows test PC.', 'Install 0.5.11 once on existing PCs; later verified agent updates are automatic. Windows username and password are required; a PIN is not a password.') | Out-File BUILD-INFO.txt
          $signing | Out-File -Append $env:GITHUB_STEP_SUMMARY
      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: WindowsProtect-v0.5.11-test
          path: |
            WindowsProtect_Test.exe
            DeviceSupportHost.exe
            WindowsProtect_Setup.exe
            WindowsProtect_Setup_Preview.png
            WindowsProtect_Message_Preview.png
            SHA256.txt
            BUILD-INFO.txt
          retention-days: 14

      - name: Publish dashboard installer download
        if: github.ref == 'refs/heads/main'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $hash=(Get-FileHash WindowsProtect_Setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $agentHash=(Get-FileHash DeviceSupportHost.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          @{version='0.5.11';sha256=$hash} | ConvertTo-Json -Compress | Set-Content installer-sha256.json -Encoding UTF8
          @{version='0.5.11';sha256=$agentHash} | ConvertTo-Json -Compress | Set-Content agent-sha256.json -Encoding UTF8
          @('WindowsProtect 0.5.11 prerelease.', 'Adds Koko/Ashu assignment, a 30-minute UltraViewer exception controlled from DeviceHost, and verified automatic agent updates.', 'Unsigned installer and agent. Windows publisher warnings may appear.', 'Install 0.5.11 once on existing PCs; later verified agent updates are automatic.') | Set-Content RELEASE-NOTES.txt -Encoding UTF8
          $ErrorActionPreference='Continue'
          gh release view v0.5.11 --repo $env:GITHUB_REPOSITORY 2>$null | Out-Null
          $releaseExists=($LASTEXITCODE -eq 0)
          $ErrorActionPreference='Stop'
          if ($releaseExists) { throw 'Release v0.5.11 already exists. Increment the release version instead of overwriting it.' }
          gh release create v0.5.11 WindowsProtect_Setup.exe DeviceSupportHost.exe installer-sha256.json agent-sha256.json SHA256.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'WindowsProtect 0.5.11' --prerelease --notes-file RELEASE-NOTES.txt
          if ($LASTEXITCODE -ne 0) { throw 'Unable to publish installer download.' }
